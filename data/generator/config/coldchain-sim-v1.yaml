# Synthetic cold-chain journey simulator — configuration v1.0.0
#
# Every value here is a PROJECT SIMULATION ASSUMPTION for a teaching prototype,
# not a regulatory or clinical parameter. Policy values (limits, durations, gap
# thresholds) are NOT duplicated here: they are read from the approved policy file.
#
# Ranges written as [a, b] are sampled uniformly (integers when both bounds are
# integers and the parameter is a count). Weights are normalised and allocated to
# journeys by largest remainder, so every scenario with a non-zero weight appears.
#
# Changing any value changes the dataset: bump config_version and regenerate.

config_version: "1.0.0"

dataset:
  name: coldchain-sim
  version: "1.0.0"
  journey_count: 200
  id_prefix: SIM
  # Departure times are drawn (to the minute) from this UTC window.
  departure_window:
    from: "2026-09-01T00:00:00Z"
    to: "2026-10-25T00:00:00Z"

policy:
  # Path relative to the repository root. Labels are derived from this file and its
  # canonical SHA-256 is written into the manifest; the importer checks it against the DB.
  file: backend/app/seed/data/policies/POL-CHILL-01_v1.0.json

simulation:
  physics_step_min: 1            # internal resolution of the physical simulation
  sampling_interval_min: 5       # nominal logger sampling interval (approved simulation assumption)
  journey_duration_h:            # approved: 24-72 h, 48 h default (triangular mode)
    min: 24
    mode: 48
    max: 72
  temperature_resolution_c: 0.1  # logger display resolution
  ambient_resolution_c: 0.1
  battery_resolution_pct: 0.1

# Primary scenario of each journey (exactly one per journey).
scenario_mix:
  NORMAL: 0.20
  GRADUAL_WARMING: 0.125
  HIGH_EXCURSION: 0.125
  LOW_EXCURSION: 0.10
  SENSOR_SPIKE: 0.10
  SENSOR_BIAS_DRIFT: 0.10
  MISSING_READINGS: 0.10
  OCEAN_COVERAGE_GAP: 0.10
  DOOR_OPENING: 0.05

# Ambient profile of each journey; allocated by quota inside every scenario.
ambient_profiles:
  weights:
    TEMPERATE: 0.35
    HOT: 0.30
    COLD: 0.20
    VARIABLE: 0.15
  TEMPERATE:
    mean_c: [10.0, 20.0]
    diurnal_amplitude_c: [4.0, 8.0]
  HOT:
    mean_c: [26.0, 34.0]
    diurnal_amplitude_c: [4.0, 8.0]
  COLD:
    mean_c: [-10.0, 2.0]
    diurnal_amplitude_c: [2.0, 5.0]
  VARIABLE:                       # route crosses climates: mean changes linearly
    start_mean_c: [-2.0, 35.0]
    min_mean_change_c: 12.0
    end_mean_bounds_c: [-5.0, 36.0]
    diurnal_amplitude_c: [3.0, 7.0]
  weather_ar_coefficient: 0.998   # per-minute AR(1) weather deviation
  weather_innovation_sd_c: 0.05

# Product (logger) temperature, first-order thermal model, 1-minute Euler steps:
#   dT = c*k_cool*(S - T) + (k_res + (1-c)*k_amb)*(A - T) + k_door*(A - T) + noise
# c = cooling effectiveness (1 working, 0 lost), S = controlled setpoint, A = ambient.
thermal:
  setpoint_c: [3.5, 5.0]
  initial_offset_c: [-0.5, 1.0]
  cooling_coupling_per_min: [0.03, 0.06]
  ambient_coupling_per_min: [0.0012, 0.0025]   # applies fully only while cooling is lost
  residual_ambient_fraction: 0.15               # small ambient influence while cooling works
  process_noise_sd_c: [0.01, 0.02]
  load_wobble_amplitude_c: [0.0, 0.3]
  load_wobble_period_h: [3.0, 8.0]
  defrost_interval_h: [6.0, 10.0]               # benign normal variation, labelled DEFROST_CYCLE
  defrost_duration_min: [10, 20]

sensor:
  calibration_bias_c: [-0.2, 0.2]   # always present, within tolerance, not a fault event
  noise_sd_c: [0.05, 0.15]
  no_ambient_probe_prob: 0.05       # whole journey reports ambient_temperature_c = NULL
  ambient_probe_noise_sd_c: 0.3
  physical_range_c: [-40.0, 60.0]   # observed values are clipped to the logger range

battery:
  start_pct: [55.0, 100.0]
  drain_pct_per_day: [0.3, 1.5]
  cold_drain_multiplier: 1.6
  cold_ambient_threshold_c: 5.0

transmission:
  upload_interval_min: 15           # gateway uploads buffered readings every 15 minutes
  network_latency_s: [2, 90]
  upload_failure_prob: 0.02         # failed upload: readings wait for the next upload
  random_dropout_prob: 0.003        # per reading, never delivered (any scenario)
  final_flush_delay_min: [1, 5]     # last upload after arrival

# Modifiers that may be added to any journey on top of its primary scenario.
secondary:
  door_opening_prob: 0.15
  door_opening_events: [1, 2]
  sensor_spike_prob: 0.05
  sensor_spike_events: [1, 1]
  sea_route_prob: 0.15              # sea route without a coverage outage (satellite link)

scenarios:
  GRADUAL_WARMING:
    creep_rate_c_per_h: [0.25, 1.2]
    duration_h: [3.0, 10.0]
    corrected_prob: 0.6             # otherwise the drifted setpoint persists until arrival
  HIGH_EXCURSION:
    reefer_failure_min_ambient_c: 20.0   # below this ambient a cooling loss cannot warm the load
    reefer_failure_duration_min: [90, 360]
    setpoint_fault_c: [10.0, 15.0]
    setpoint_fault_duration_min: [60, 240]
    second_event_prob: 0.2
  LOW_EXCURSION:
    setpoint_fault_c: [-3.0, 1.0]
    duration_min: [30, 240]
    second_event_prob: 0.15
  SENSOR_SPIKE:
    events: [1, 4]
    two_reading_prob: 0.2
    positive_prob: 0.85
    positive_c: [4.0, 12.0]
    negative_c: [4.0, 8.0]
  SENSOR_BIAS_DRIFT:
    mode_weights:
      BIAS: 0.40
      DRIFT: 0.35
      BIAS_AND_DRIFT: 0.25
    bias_c: [1.0, 3.0]
    positive_bias_prob: 0.7
    drift_c_per_day: [0.5, 2.5]
    positive_drift_prob: 0.75
    drift_start_fraction: [0.0, 0.5]
  MISSING_READINGS:
    gaps: [1, 4]
    gap_class_weights:              # by number of consecutive missing readings
      SHORT: 0.3                    # 1-2 readings  -> observed gap 10-15 min (not UNKNOWN)
      UNKNOWN: 0.3                  # 3-4 readings  -> observed gap 20-25 min (UNKNOWN)
      REVIEW: 0.4                   # 5-36 readings -> observed gap 30-185 min (UNKNOWN + review)
    short_readings: [1, 2]
    unknown_readings: [3, 4]
    review_readings: [5, 36]
    min_separation_readings: 3
    battery_depleted_prob: 0.25     # logger battery runs out; no readings until arrival
    battery_depleted_start_pct: [3.0, 8.0]
    battery_depleted_at_fraction: [0.55, 0.9]
    hidden_excursion_prob: 0.35     # a temperature fault starts inside a long gap
    hidden_excursion_min_gap_readings: 12
    hidden_excursion_duration_min: [90, 300]
  OCEAN_COVERAGE_GAP:
    min_journey_h: 36
    outage_h: [4.0, 14.0]
    start_fraction: [0.2, 0.55]
    restore_upload_delay_min: [2, 20]
    hidden_excursion_prob: 0.5      # temperature fault during the outage (demo scenario DEMO-01)
    hidden_excursion_duration_min: [90, 300]
  DOOR_OPENING:
    events: [2, 6]
    long_event_prob: 0.2
    short_duration_min: [2, 10]
    long_duration_min: [10, 30]
    door_coupling_per_min: [0.004, 0.015]

labels:
  significant_bias_c: 0.5           # |bias| at or above this is labelled a SENSOR_BIAS fault

splits:
  fractions:
    train: 0.70
    validation: 0.15
    test: 0.15
  seed: null                        # null -> use the dataset seed
