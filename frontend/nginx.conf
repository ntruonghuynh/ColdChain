# Serves the built React app and reverse-proxies /api to the backend container.
# The browser only ever talks to this server (same origin), so no backend
# hostname or port is hardcoded in the frontend.

map $http_x_request_id $coldchain_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time lets nginx start (and serve
    # the UI with a clear "API unreachable" state) even if the backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $coldchain_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Only nginx-generated errors (backend unreachable) are replaced; backend
        # responses, including its own 503 health report, pass through unchanged.
        error_page 502 504 = @api_unreachable;
    }

    location @api_unreachable {
        default_type application/json;
        return 502 '{"error":{"code":"api_unreachable","message":"The backend API is not reachable.","details":null,"request_id":"$coldchain_request_id"}}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
