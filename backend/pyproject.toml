[project]
name = "coldchain-backend"
version = "0.1.0"
description = "Cold Chain Monitoring and Excursion Response - FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # Simulator configuration files (data/generator/config/*.yaml), Milestone 2.
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.9,<1.10",
    "web3==7.5.0",
    "cryptography==46.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test needs a reachable PostgreSQL server",
]
